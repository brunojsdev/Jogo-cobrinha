<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake.py - Pro Edition</title>
    
    <!-- Bibliotecas Seguras via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.12.0/brython.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.12.0/brython_stdlib.js"></script>

    <style>
        :root {
            --fundo-claro: #150136;
            --fundo-medio: #090024;
            --fundo-escuro: #040014;
            --destaque-claro: #ffdd00;
            --destaque-medio: #ffaa00;
            --destaque-escuro: #ff9900;
            --brilho-interface: #8b87ff; 
            --btm-claro: #17005c;
            --btm-medio: #110042;
            --btm-escuro: #0d0033;
            --btm-claro-h: #6b4100;
            --borda-clara: #5752ff;
            --borda-escura: #ffaa00;
        }

        body { 
            background-color: var(--fundo-escuro);
            color: var(--brilho-interface);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Estilização do Canvas (Maior no Desktop) */
        canvas { 
            background-color: var(--fundo-claro);
            border: 4px solid var(--borda-clara);
            box-shadow: 0 0 20px rgba(87, 82, 255, 0.4);
            max-width: 100%;
            height: auto;
        }

        .neon-border { border: 1px solid var(--borda-clara); }
        .neon-text { color: var(--destaque-claro); text-shadow: 0 0 10px var(--destaque-medio); }
        
        .panel { 
            background: linear-gradient(145deg, var(--fundo-medio), var(--fundo-escuro));
            border-radius: 1rem;
            padding: 1.5rem;
        }

        .btn-main {
            background-color: var(--btm-claro);
            border: 2px solid var(--borda-escura);
            color: var(--destaque-claro);
            transition: all 0.2s;
            cursor: pointer;
        }

        .btn-main:hover { background-color: var(--btm-claro-h); transform: translateY(-2px); }

        /* Ajuste para o D-Pad Mobile */
        .d-pad-btn {
            background-color: var(--btm-medio);
            border: 1px solid var(--borda-clara);
            color: var(--destaque-claro);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }
    </style>
</head>
<body onload="brython()" class="min-h-screen p-4 lg:p-8">

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- COLUNA ESQUERDA: Info e Placar (Tutorial e Ranking) -->
        <div class="lg:col-span-4 space-y-6 order-2 lg:order-1">
            
            <!-- Painel de Tutorial -->
            <div class="panel neon-border">
                <h2 class="text-xl font-bold neon-text mb-4">COMO JOGAR</h2>
                <div class="space-y-3 text-sm">
                    <p class="flex items-center gap-2">
                        <kbd class="bg-indigo-900 px-2 py-1 rounded border border-indigo-400">Setas</kbd> Movem a cobra
                    </p>
                    <p class="flex items-center gap-2">
                        <kbd class="bg-indigo-900 px-2 py-1 rounded border border-indigo-400">Espaço/Enter</kbd> Inicia o jogo
                    </p>
                    <p class="opacity-70 italic mt-2">No celular, use os botões abaixo ou deslize o dedo na tela.</p>
                </div>
            </div>

            <!-- Painel de Ranking -->
            <div class="panel neon-border">
                <h2 class="text-xl font-bold neon-text mb-4">PLACAR DE LÍDERES</h2>
                <div class="space-y-4">
                    <div class="flex justify-between items-center border-b border-indigo-900/50 pb-2">
                        <span class="text-sm opacity-80 uppercase tracking-tighter">Última Pontuação</span>
                        <span id="last-score" class="text-2xl font-bold text-white">0</span>
                    </div>
                    
                    <div class="space-y-2">
                        <p class="text-xs uppercase text-indigo-400 font-bold mb-2 tracking-widest">TOP 3 RECORDES</p>
                        <div id="ranking-list" class="space-y-2">
                            <div class="flex justify-between items-center bg-black/30 p-2 rounded">
                                <span class="text-yellow-500 font-bold">1º</span>
                                <span class="rank-val font-mono">---</span>
                            </div>
                            <div class="flex justify-between items-center bg-black/30 p-2 rounded">
                                <span class="text-gray-400 font-bold">2º</span>
                                <span class="rank-val font-mono">---</span>
                            </div>
                            <div class="flex justify-between items-center bg-black/30 p-2 rounded">
                                <span class="text-orange-600 font-bold">3º</span>
                                <span class="rank-val font-mono">---</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- COLUNA DIREITA: Tela do Jogo -->
        <div class="lg:col-span-8 flex flex-col items-center lg:items-end order-1 lg:order-2">
            
            <!-- Header do Jogo -->
            <div class="w-full max-w-[500px] flex justify-between items-end mb-4">
                <h1 class="text-4xl font-black italic tracking-tighter neon-text">SNAKE.PY</h1>
                <div class="text-right">
                    <p class="text-xs uppercase font-bold opacity-60">Score Atual</p>
                    <p id="score-display" class="text-4xl font-mono text-white leading-none">0</p>
                </div>
            </div>

            <!-- Container do Canvas -->
            <div class="relative w-full max-w-[500px]">
                <canvas id="gameCanvas" width="500" height="500" class="rounded-xl touch-none"></canvas>
                
                <!-- Overlay de Início/Fim -->
                <div id="overlay" class="absolute inset-0 bg-black/60 flex items-center justify-center rounded-xl backdrop-blur-sm">
                    <button id="restart-btn" class="btn-main px-8 py-4 rounded-full font-bold text-xl uppercase tracking-widest shadow-2xl">
                        Jogar (Enter)
                    </button>
                </div>
            </div>

            <!-- Controles Mobile (Apenas visível em telas pequenas) -->
            <div class="grid grid-cols-3 gap-2 mt-8 lg:hidden">
                <div></div>
                <button id="btn-up" class="d-pad-btn">▲</button>
                <div></div>
                <button id="btn-left" class="d-pad-btn">◀</button>
                <button id="btn-down" class="d-pad-btn">▼</button>
                <button id="btn-right" class="d-pad-btn">▶</button>
            </div>
        </div>

    </div>

    <!-- Script de Lógica do Jogo -->
    <script type="text/python" src="main.py"></script>
</body>
</html>
