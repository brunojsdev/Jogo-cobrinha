    <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo da Cobrinha</title>

    <!-- Ícone da aba do navegador -->
    <link rel="icon" type="image/png" href="./img/fi-port.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Brython Engine -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.12.0/brython.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.12.0/brython_stdlib.js"></script>

    <style>
        :root {
            --fundo-claro: #150136;
            --fundo-medio: #090024;
            --fundo-escuro: #040014;
            --destaque-claro: #ffdd00;
            --destaque-medio: #ffaa00;
            --destaque-escuro: #ff9900;
            --brilho-interface: #8b87ff; 
            --btm-claro: #17005c;
            --btm-medio: #110042;
            --btm-escuro: #0d0033;
            --btm-claro-h: #6b4100;
            --btm-medio-h: #4d2b01;
            --borda-clara: #5752ff;
            --borda-escura: #ffaa00;
            
            /* CORES SOMBRAS DE FUNDO */
            --sombra-topo: rgba(0, 0, 0, 0.85);
            --vinheta-bordas: rgba(3, 0, 10, 0.7); /* Mais claro que o anterior */
            --fundo-profundo: #03000a;
            
            /* CORES DAS NEBULOSAS (Ajustadas para mais brilho) */
            --nuvem-indigo: rgba(75, 0, 130, 0.25);    
            --nuvem-violeta: rgba(138, 43, 226, 0.2); 
            --nuvem-magenta: rgba(200, 0, 255, 0.15);  
            --nuvem-base: rgba(40, 0, 100, 0.3);               
        }

        /* --- ESTILO DO BOTÃO VOLTAR --- */
        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            cursor: pointer;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(139, 135, 255, 0.1) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--borda-clara) !important;
            color: #ffffff; /* Troquei var(--textos) por branco para o texto aparecer */
        }
        
        .back-btn:hover {
            border-color: var(--destaque-claro) !important;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.4);
            color: var(--destaque-claro) !important;
            transform: translateX(-3px);
        }
        
        .btn-icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }

    
        body { 
            touch-action: none; 
            color: var(--brilho-interface);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: var(--fundo-profundo);
            
            background-image: 
                /* 1. Sombra no Topo (Mantido exatamente como estava para legibilidade) */
                linear-gradient(to bottom, var(--sombra-topo) 0%, transparent 20%),
                
                /* 2. Vinheta lateral reajustada (Mais espaço para as nebulosas) */
                radial-gradient(circle at center, transparent 70%, var(--vinheta-bordas) 100%),
                
                /* 3. Nebulosas centrais (Mais vivas no centro e parte inferior) */
                radial-gradient(circle at 50% 35%, var(--nuvem-indigo), transparent 65%),
                radial-gradient(circle at 20% 50%, var(--nuvem-violeta), transparent 55%),
                radial-gradient(circle at 80% 75%, var(--nuvem-magenta), transparent 55%),
                radial-gradient(circle at 50% 100%, var(--nuvem-base), transparent 70%);
              
            background-attachment: fixed;
        }
        
        canvas { 
            box-shadow: 0 0 60px rgba(87, 82, 255, 0.25); 
            background-color: var(--fundo-claro);
            border: 4px solid var(--borda-clara);
            width: 100%;
            height: auto;
            display: block;
        }

        .panel-box { 
            background-color: var(--fundo-medio); 
            border: 2px solid var(--borda-clara); 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .btn-restart { 
            background-color: var(--btm-claro); 
            border: 2px solid var(--borda-escura); 
            color: var(--destaque-claro); 
            text-transform: uppercase;
            font-style: italic;
            font-weight: 900;
            transition: all 0.2s ease-out;
        }
        /* Efeito de brilho amarelo no botão de reiniciar (corrigido) */
        .btn-restart:hover {
            background-color: var(--btm-claro);
            border-color: var(--destaque-claro);
            transform: scale(1.05);
            box-shadow: 0 0 25px var(--destaque-medio);
        }
        
        .btn-mobile { 
            background-color: var(--btm-medio); 
            border: 2px solid var(--borda-clara); 
            color: var(--destaque-claro);
            transition: all 0.15s ease-out;
        }
        /* Efeito de brilho roxo quando o botão touch é pressionado */
        .btn-mobile.glow-active {
            background-color: var(--btm-claro);
            border-color: #ffffff;
            transform: scale(0.92);
            box-shadow: 0 0 20px var(--brilho-interface), inset 0 0 10px var(--brilho-interface);
            color: #ffffff;
        }

        @media (min-width: 1024px) {
            .side-panel {
                height: 440px; 
            }
        }

        @media (max-width: 1023px) {
            .info-container {
                width: 100%;
                max-width: 440px;
            }
        }
    </style>
</head>
<body onload="brython()">

    <!-- Botão Voltar ao Portfolio -->
    <a href="https://brunojsilveira.vercel.app/" id="back-btn" onclick="window.close();" class="back-btn">
    <div class="btn-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-left">
            <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
        </svg>
    </div>
    <span class="btn-text">Voltar ao Portfolio</span>
    </a>
    
    <div class="flex flex-col lg:flex-row items-center lg:items-start justify-center gap-4 w-full max-w-6xl">
        
        <!-- PAINEL DE INFO -->
        <div class="info-container side-panel flex flex-row lg:flex-col gap-3 order-1 lg:w-64">
            <div class="panel-box rounded-2xl p-4 flex-1">
                <h3 class="text-[var(--destaque-medio)] font-bold text-sm mb-1 tracking-widest uppercase italic">Como Jogar</h3>
                <div class="hidden lg:block w-full space-y-1 text-sm text-center">
                    <p class="border-b border-white/10 pb-1 italic">Setas para Mover</p>
                    <p class="italic">Espaço para Reset</p>
                </div>
                <div class="lg:hidden text-center">
                    <p class="text-sm text-white/90 italic font-medium">Setas ou Deslize</p>
                </div>
            </div>

            <div class="panel-box rounded-2xl p-4 flex-1">
                <p class="text-sm uppercase tracking-[0.3em] text-[var(--brilho-interface)] mb-1 font-black italic">Pontuação</p>
                <div id="score-display" class="text-[var(--destaque-claro)] font-black text-5xl lg:text-6xl leading-none tracking-tighter">0</div>
            </div>
        </div>

        <!-- ARENA DO JOGO -->
        <div class="relative order-2 w-full max-w-[440px]">
            <canvas id="gameCanvas" width="440" height="440" class="rounded-3xl"></canvas>
            
            <!-- UI Fim de Jogo -->
            <div id="game-over-ui" class="absolute inset-0 flex flex-col items-center justify-center z-20 hidden bg-black/60 rounded-3xl">
                <h2 class="text-[var(--destaque-claro)] font-black text-5xl mb-4 italic tracking-tighter drop-shadow-lg">FIM DE JOGO</h2>
                <button id="restart-btn" class="btn-restart py-4 px-10 rounded-full shadow-2xl text-lg">
                    Jogar Novamente
                </button>
            </div>
        </div>

        <!-- CONTROLES MOBILE -->
        <div class="lg:hidden order-3 w-full flex justify-center mt-2 pb-4">
            <div class="grid grid-cols-3 gap-3 w-[220px]">
                <div></div>
                <button id="btn-up" class="btn-mobile rounded-2xl h-14 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
                </button>
                <div></div>
                
                <button id="btn-left" class="btn-mobile rounded-2xl h-14 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                </button>
                <button id="btn-down" class="btn-mobile rounded-2xl h-14 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
                </button>
                <button id="btn-right" class="btn-mobile rounded-2xl h-14 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </button>
            </div>
        </div>

    </div>

    <!-- Referência ao script Python externo -->
    <script type="text/python" src="main.py"></script>

</body>
</html>
