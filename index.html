<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Python Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Brython Engine -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.12.0/brython.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.12.0/brython_stdlib.js"></script>

    <style>
        :root {
            --fundo-claro: #150136;
            --fundo-medio: #090024;
            --fundo-escuro: #040014;
            --destaque-claro: #ffdd00;
            --destaque-medio: #ffaa00;
            --destaque-escuro: #ff9900;
            --brilho-interface: #8b87ff; 
            --btm-claro: #17005c;
            --btm-medio: #110042;
            --btm-escuro: #0d0033;
            --btm-claro-h: #6b4100;
            --btm-medio-h: #4d2b01;
            --borda-clara: #5752ff;
            --borda-escura: #ffaa00;
        }

        body { 
            touch-action: none; 
            background-color: var(--fundo-escuro);
            color: var(--brilho-interface);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 10px;
        }
        
        canvas { 
            box-shadow: 0 0 60px rgba(87, 82, 255, 0.25); 
            background-color: var(--fundo-claro);
            border: 4px solid var(--borda-clara);
            width: 100%;
            height: auto;
            display: block;
        }

        .panel-box { 
            background-color: var(--fundo-medio); 
            border: 2px solid var(--borda-clara); 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .btn-restart { 
            background-color: var(--btm-claro); 
            border: 2px solid var(--borda-escura); 
            color: var(--destaque-claro); 
            text-transform: uppercase;
            font-style: italic;
            font-weight: 900;
            transition: all 0.2s;
        }
        .btn-restart:hover {
            background-color: var(--btm-claro-h);
            transform: scale(1.05);
        }
        
        .btn-mobile { 
            background-color: var(--btm-medio); 
            border: 2px solid var(--borda-clara); 
            color: var(--destaque-claro);
        }

        /* Desktop: Mesma altura do canvas */
        @media (min-width: 1024px) {
            .side-panel {
                height: 440px; 
            }
        }

        /* Mobile: Mesma largura do canvas */
        @media (max-width: 1023px) {
            .info-container {
                width: 100%;
                max-width: 440px;
            }
        }
    </style>
</head>
<body onload="brython()">

    <div class="flex flex-col lg:flex-row items-center lg:items-start justify-center gap-4 w-full max-w-6xl">
        
        <!-- PAINEL DE INFO -->
        <div class="info-container side-panel flex flex-row lg:flex-col gap-3 order-1 lg:w-64">
            
            <!-- 1. Instruções -->
            <div class="panel-box rounded-2xl p-4 flex-1">
                <h3 class="text-[var(--destaque-medio)] font-bold text-sm mb-1 tracking-widest uppercase italic">Como Jogar</h3>
                <div class="hidden lg:block w-full space-y-1 text-sm text-center">
                    <p class="border-b border-white/10 pb-1 italic">Setas para Mover</p>
                    <p class="italic">Espaço para Reset</p>
                </div>
                <div class="lg:hidden text-center">
                    <p class="text-sm text-white/90 italic font-medium">Setas ou Deslize</p>
                </div>
            </div>

            <!-- 2. Pontuação -->
            <div class="panel-box rounded-2xl p-4 flex-1">
                <p class="text-sm uppercase tracking-[0.3em] text-[var(--brilho-interface)] mb-1 font-black italic">Pontuação</p>
                <div id="score-display" class="text-[var(--destaque-claro)] font-black text-5xl lg:text-6xl leading-none tracking-tighter">0</div>
            </div>
        </div>

        <!-- ARENA DO JOGO -->
        <div class="relative order-2 w-full max-w-[440px]">
            <canvas id="gameCanvas" width="440" height="440" class="rounded-3xl"></canvas>
            
            <!-- UI Fim de Jogo -->
            <div id="game-over-ui" class="absolute inset-0 flex flex-col items-center justify-center z-20 hidden bg-black/60 rounded-3xl">
                <h2 class="text-[var(--destaque-claro)] font-black text-5xl mb-4 italic tracking-tighter drop-shadow-lg">FIM DE JOGO</h2>
                <button id="restart-btn" class="btn-restart py-4 px-10 rounded-full shadow-2xl text-lg">
                    Jogar Novamente
                </button>
            </div>
        </div>

        <!-- CONTROLES MOBILE -->
        <div class="lg:hidden order-3 w-full flex justify-center mt-2 pb-4">
            <div class="grid grid-cols-3 gap-3 w-[220px]">
                <div></div>
                <button id="btn-up" class="btn-mobile rounded-2xl h-14 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
                </button>
                <div></div>
                
                <button id="btn-left" class="btn-mobile rounded-2xl h-14 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                </button>
                <button id="btn-down" class="btn-mobile rounded-2xl h-14 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
                </button>
                <button id="btn-right" class="btn-mobile rounded-2xl h-14 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </button>
            </div>
        </div>

    </div>

    <script type="text/python">
from browser import document, window, html
import random
import math

canvas = document["gameCanvas"]
ctx = canvas.getContext("2d")
box = 20
snake = []
food = {}
score = 0
direction = "RIGHT"
game_loop_ref = None
is_game_over = False

def spawn_food():
    while True:
        fx = random.randint(0, (canvas.width // box) - 1) * box
        fy = random.randint(0, (canvas.height // box) - 1) * box
        if not any(s['x'] == fx and s['y'] == fy for s in snake):
            return {"x": fx, "y": fy}

def set_dir(new_dir):
    global direction
    pairs = {"LEFT": "RIGHT", "RIGHT": "LEFT", "UP": "DOWN", "DOWN": "UP"}
    if new_dir != pairs.get(direction):
        direction = new_dir

def key_press(ev):
    global is_game_over
    key_map = {37: "LEFT", 38: "UP", 39: "RIGHT", 40: "DOWN"}
    if ev.keyCode in key_map:
        ev.preventDefault()
        set_dir(key_map[ev.keyCode])
    elif ev.keyCode in [32, 13]:
        ev.preventDefault()
        if is_game_over or game_loop_ref is None:
            start()

document.bind("keydown", key_press)

# Swipe Logic
t_start = [0, 0]
def t_start_h(ev):
    global t_start
    t_start = [ev.touches[0].clientX, ev.touches[0].clientY]
    if ev.target.id == "gameCanvas":
        ev.preventDefault()

def t_end_h(ev):
    dx = ev.changedTouches[0].clientX - t_start[0]
    dy = ev.changedTouches[0].clientY - t_start[1]
    if abs(dx) > 25 or abs(dy) > 25:
        if abs(dx) > abs(dy):
            set_dir("RIGHT" if dx > 0 else "LEFT")
        else:
            set_dir("DOWN" if dy > 0 else "UP")
    if ev.target.id == "gameCanvas":
        ev.preventDefault()

canvas.bind("touchstart", t_start_h)
canvas.bind("touchend", t_end_h)

def bind_btn(id, d):
    def h(e): 
        e.preventDefault()
        set_dir(d)
    document[id].bind("touchstart", h)
    document[id].bind("mousedown", h)

for b, d in [("btn-up","UP"), ("btn-down","DOWN"), ("btn-left","LEFT"), ("btn-right","RIGHT")]:
    bind_btn(b, d)

def game_over():
    global is_game_over
    is_game_over = True
    window.clearInterval(game_loop_ref)
    document["game-over-ui"].style.display = "flex"

def update(*args):
    global score, food, snake
    ctx.fillStyle = "#150136"
    ctx.fillRect(0, 0, canvas.width, canvas.height)
    
    # Food
    ctx.fillStyle = "#ffaa00"
    ctx.shadowBlur = 12
    ctx.shadowColor = "#ff9900"
    ctx.beginPath()
    ctx.arc(food["x"]+(box/2), food["y"]+(box/2), 8, 0, math.pi*2)
    ctx.fill()
    ctx.shadowBlur = 0

    # Head Logic
    head = {"x": snake[0]["x"], "y": snake[0]["y"]}
    if direction == "LEFT": head["x"] -= box
    elif direction == "UP": head["y"] -= box
    elif direction == "RIGHT": head["x"] += box
    elif direction == "DOWN": head["y"] += box

    if (head["x"] < 0 or head["x"] >= canvas.width or 
        head["y"] < 0 or head["y"] >= canvas.height or
        any(s["x"] == head["x"] and s["y"] == head["y"] for s in snake)):
        game_over()
        return

    snake.insert(0, head)
    
    if head["x"] == food["x"] and head["y"] == food["y"]:
        score += 1
        document["score-display"].text = str(score)
        food = spawn_food()
    else:
        snake.pop()

    # Draw Snake
    for i, s in enumerate(snake):
        # Corpo da cobra
        ctx.fillStyle = "#8b87ff" if i == 0 else "#5752ff"
        ctx.fillRect(s["x"]+1, s["y"]+1, box-2, box-2)
        
        # Desenhar olhos amarelos na cabeça
        if i == 0:
            ctx.fillStyle = "#ffdd00" # Amarelo vibrante
            eye_size = 4
            if direction == "RIGHT":
                ctx.fillRect(s["x"]+12, s["y"]+4, eye_size, eye_size)
                ctx.fillRect(s["x"]+12, s["y"]+12, eye_size, eye_size)
            elif direction == "LEFT":
                ctx.fillRect(s["x"]+4, s["y"]+4, eye_size, eye_size)
                ctx.fillRect(s["x"]+4, s["y"]+12, eye_size, eye_size)
            elif direction == "UP":
                ctx.fillRect(s["x"]+4, s["y"]+4, eye_size, eye_size)
                ctx.fillRect(s["x"]+12, s["y"]+4, eye_size, eye_size)
            elif direction == "DOWN":
                ctx.fillRect(s["x"]+4, s["y"]+12, eye_size, eye_size)
                ctx.fillRect(s["x"]+12, s["y"]+12, eye_size, eye_size)

def start(ev=None):
    global snake, score, direction, food, game_loop_ref, is_game_over
    is_game_over = False
    mid = (canvas.width // box // 2) * box
    snake = [{"x": mid, "y": mid}, {"x": mid-box, "y": mid}]
    score = 0
    direction = "RIGHT"
    food = spawn_food()
    document["score-display"].text = "0"
    document["game-over-ui"].style.display = "none"
    if game_loop_ref: window.clearInterval(game_loop_ref)
    game_loop_ref = window.setInterval(update, 100)

document["restart-btn"].bind("click", start)
start()
    </script>
</body>
</html>
