<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Python Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Brython Engine -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.12.0/brython.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.12.0/brython_stdlib.js"></script>

    <style>
        :root {
            --fundo-claro: #150136;
            --fundo-medio: #090024;
            --fundo-escuro: #040014;
            --destaque-claro: #ffdd00;
            --destaque-medio: #ffaa00;
            --destaque-escuro: #ff9900;
            --brilho-interface: #8b87ff; 
            --btm-claro: #17005c;
            --btm-medio: #110042;
            --btm-escuro: #0d0033;
            --btm-claro-h: #6b4100;
            --btm-medio-h: #4d2b01;
            --borda-clara: #5752ff;
            --borda-escura: #ffaa00;
        }

        body { 
            touch-action: none; 
            background-color: var(--fundo-escuro);
            color: var(--brilho-interface);
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Garante que não crie barra de rolagem */
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        canvas { 
            box-shadow: 0 0 30px rgba(87, 82, 255, 0.15); 
            background-color: var(--fundo-claro);
            border: 3px solid var(--borda-clara);
        }

        .title-text { 
            color: var(--destaque-claro); 
            text-shadow: 0 0 10px var(--destaque-escuro); 
        }
        
        .panel-box { 
            background-color: var(--fundo-medio); 
            border: 2px solid var(--borda-clara); 
        }
        
        .btn-restart { 
            background-color: var(--btm-claro); 
            border: 2px solid var(--borda-escura); 
            color: var(--destaque-claro); 
        }
        .btn-restart:hover { background-color: var(--btm-claro-h); }
        
        .btn-mobile { 
            background-color: var(--btm-medio); 
            border: 2px solid var(--borda-clara); 
            color: var(--destaque-claro);
        }
        .btn-mobile:active { background-color: var(--btm-medio-h); }
    </style>
</head>
<body onload="brython()">

    <!-- Main Container -->
    <div class="flex flex-col lg:flex-row items-center justify-center gap-3 lg:gap-6 p-2 w-full max-w-6xl h-full max-h-screen">
        
        <!-- UI PANEL: Topo no Mobile (order-1), Lado no Desktop (lg:order-2) -->
        <div class="flex flex-col gap-2 w-full max-w-[340px] lg:w-72 order-1 lg:order-2">
            
            <!-- Tutorial Desktop (Acima da pontuação) -->
            <div class="hidden lg:block panel-box rounded-xl p-4">
                <h3 class="text-[var(--destaque-medio)] font-bold text-xs mb-2 tracking-widest uppercase text-center">Controles PC</h3>
                <div class="space-y-2 text-[11px]">
                    <div class="flex justify-between items-center border-b border-white/5 pb-1">
                        <span class="opacity-70 italic">Movimentar</span>
                        <span class="bg-[var(--btm-claro)] px-2 py-1 rounded text-white font-mono">Setas</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="opacity-70 italic">Iniciar</span>
                        <span class="bg-[var(--btm-claro)] px-2 py-1 rounded text-white font-mono">Space / Enter</span>
                    </div>
                </div>
            </div>

            <!-- Tutorial Mobile (Acima da pontuação) -->
            <div class="lg:hidden panel-box rounded-xl p-2">
                <h3 class="text-[var(--destaque-medio)] font-bold text-[10px] tracking-widest uppercase text-center mb-1">Controles Touch</h3>
                <p class="text-[9px] text-center opacity-70 italic leading-tight">Use as setas abaixo ou deslize sobre o jogo.</p>
            </div>

            <!-- Score Card -->
            <div class="panel-box rounded-xl p-3 lg:p-6 text-center">
                <h1 class="text-xl lg:text-3xl font-black title-text tracking-tighter mb-1 italic uppercase">Snake Pro</h1>
                <div class="h-px bg-[var(--borda-clara)] w-full mb-2 opacity-30"></div>
                <p class="text-[9px] lg:text-[10px] uppercase tracking-[0.3em] opacity-60 mb-1 font-bold">Pontos</p>
                <div id="score-display" class="text-[var(--destaque-claro)] font-black text-4xl lg:text-6xl leading-none">0</div>
            </div>

        </div>

        <!-- GAME ARENA & CONTROLS: Baixo no Mobile (order-2), Esquerda no Desktop (lg:order-1) -->
        <div class="flex flex-col items-center gap-2 lg:gap-4 order-2 lg:order-1 w-full max-w-[340px] lg:max-w-none">
            
            <!-- Jogo -->
            <div class="relative w-full lg:w-auto flex justify-center">
                <!-- Limitamos o tamanho no mobile para garantir que os botões caibam -->
                <canvas id="gameCanvas" width="400" height="400" class="rounded-xl w-full max-w-[280px] sm:max-w-[340px] lg:max-w-[400px] aspect-square"></canvas>
                
                <button id="restart-btn" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 btn-restart font-black py-3 px-8 lg:py-5 lg:px-12 rounded-full shadow-2xl z-20 hidden text-base lg:text-xl tracking-tighter uppercase italic">
                    Iniciar
                </button>
            </div>

            <!-- Mobile Arrow Buttons (Abaixo do Jogo) -->
            <div class="lg:hidden flex justify-center w-full">
                <div class="grid grid-cols-3 gap-1 w-[160px]">
                    <div></div>
                    <button id="btn-up" class="btn-mobile rounded-lg h-12 flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
                    </button>
                    <div></div>
                    <button id="btn-left" class="btn-mobile rounded-lg h-12 flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                    </button>
                    <button id="btn-down" class="btn-mobile rounded-lg h-12 flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
                    </button>
                    <button id="btn-right" class="btn-mobile rounded-lg h-12 flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </button>
                </div>
            </div>

        </div>

    </div>

    <!-- Importação do arquivo Python Externo -->
    <script type="text/python" src="main.py"></script>
</body>
</html>
