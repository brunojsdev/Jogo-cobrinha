<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake.py - Pro Edition</title>
    
    <!-- Bibliotecas Seguras via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.12.0/brython.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.12.0/brython_stdlib.js"></script>

    <style>
        :root {
            --fundo-claro: #150136;
            --fundo-medio: #090024;
            --fundo-escuro: #040014;
            --destaque-claro: #ffdd00;
            --destaque-medio: #ffaa00;
            --destaque-escuro: #ff9900;
            --brilho-interface: #8b87ff; 
            --btm-claro: #17005c;
            --btm-medio: #110042;
            --btm-escuro: #0d0033;
            --btm-claro-h: #6b4100;
            --borda-clara: #5752ff;
            --borda-escura: #ffaa00;
        }

        body { 
            background-color: var(--fundo-escuro);
            color: var(--brilho-interface);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Canvas maior no Desktop */
        canvas { 
            background-color: var(--fundo-claro);
            border: 4px solid var(--borda-clara);
            box-shadow: 0 0 25px rgba(87, 82, 255, 0.5);
            max-width: 100%;
            height: auto;
            display: block;
        }

        .panel { 
            background: linear-gradient(145deg, var(--fundo-medio), var(--fundo-escuro));
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid var(--borda-clara);
        }

        .neon-text { color: var(--destaque-claro); text-shadow: 0 0 10px var(--destaque-medio); }

        .btn-main {
            background-color: var(--btm-claro);
            border: 2px solid var(--borda-escura);
            color: var(--destaque-claro);
            transition: all 0.2s;
            cursor: pointer;
            z-index: 50;
        }

        .btn-main:hover { background-color: var(--btm-claro-h); transform: translateY(-2px); }

        .d-pad-btn {
            background-color: var(--btm-medio);
            border: 1px solid var(--borda-clara);
            color: var(--destaque-claro);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 1.5rem;
            user-select: none;
            touch-action: manipulation;
        }
    </style>
</head>
<body onload="brython()">

    <div class="max-w-6xl w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 p-4">
        
        <!-- COLUNA ESQUERDA: Info e Placar -->
        <div class="lg:col-span-4 space-y-6 order-2 lg:order-1">
            <div class="panel">
                <h2 class="text-xl font-bold neon-text mb-4 uppercase tracking-widest">Controles</h2>
                <div class="space-y-3 text-sm">
                    <p class="flex items-center gap-2"><kbd class="bg-indigo-900 px-2 py-1 rounded border border-indigo-400">Setas</kbd> Mover</p>
                    <p class="flex items-center gap-2"><kbd class="bg-indigo-900 px-2 py-1 rounded border border-indigo-400">Espaço/Enter</kbd> Jogar</p>
                    <p class="opacity-70 italic mt-2 text-xs">No mobile, use as setas ou deslize.</p>
                </div>
            </div>

            <div class="panel">
                <h2 class="text-xl font-bold neon-text mb-4 uppercase tracking-widest">Ranking</h2>
                <div class="space-y-4">
                    <div class="flex justify-between items-center border-b border-indigo-900/50 pb-2">
                        <span class="text-xs opacity-80 uppercase">Última</span>
                        <span id="last-score" class="text-2xl font-bold text-white">0</span>
                    </div>
                    <div id="ranking-list" class="space-y-2">
                        <p class="text-[10px] uppercase text-indigo-400 font-bold tracking-widest mb-1">Top 3 Recordes</p>
                        <div class="flex justify-between items-center bg-black/30 p-2 rounded text-sm">
                            <span class="text-yellow-500 font-bold">1º</span><span class="rank-val font-mono">---</span>
                        </div>
                        <div class="flex justify-between items-center bg-black/30 p-2 rounded text-sm">
                            <span class="text-gray-400 font-bold">2º</span><span class="rank-val font-mono">---</span>
                        </div>
                        <div class="flex justify-between items-center bg-black/30 p-2 rounded text-sm">
                            <span class="text-orange-600 font-bold">3º</span><span class="rank-val font-mono">---</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- COLUNA DIREITA: Jogo -->
        <div class="lg:col-span-8 flex flex-col items-center lg:items-end order-1 lg:order-2">
            <div class="w-full max-w-[500px] flex justify-between items-end mb-4">
                <h1 class="text-5xl font-black italic tracking-tighter neon-text">SNAKE.PY</h1>
                <div class="text-right">
                    <p class="text-[10px] uppercase font-bold opacity-60">Score</p>
                    <p id="score-display" class="text-4xl font-mono text-white leading-none">0</p>
                </div>
            </div>

            <div class="relative w-full max-w-[500px]">
                <canvas id="gameCanvas" width="500" height="500"></canvas>
                
                <!-- Overlay -->
                <div id="overlay" class="absolute inset-0 bg-black/70 flex items-center justify-center rounded-xl backdrop-blur-sm z-40">
                    <button id="restart-btn" class="btn-main px-10 py-5 rounded-full font-black text-xl uppercase tracking-widest shadow-2xl">
                        JOGAR
                    </button>
                </div>
            </div>

            <!-- D-PAD Mobile -->
            <div class="grid grid-cols-3 gap-3 mt-8 lg:hidden">
                <div></div>
                <button id="btn-up" class="d-pad-btn">▲</button>
                <div></div>
                <button id="btn-left" class="d-pad-btn">◀</button>
                <button id="btn-down" class="d-pad-btn">▼</button>
                <button id="btn-right" class="d-pad-btn">▶</button>
            </div>
        </div>
    </div>

    <!-- Importação do script Python externo -->
    <script type="text/python" src="main.py"></script>
</body>
</html>
